<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería | Luis Angel Vazquez Estrada</title>
  <meta name="description" content="Galería de capturas de los proyectos de Luis Angel Vazquez Estrada.">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav>
    <div class="contenedor">
      <ul>
        <li><a href="index.html#sobre-mi">Sobre mí</a></li>
        <li><a href="index.html#proyectos">Proyectos</a></li>
        <li><a href="index.html#habilidades">Habilidades</a></li>
        <li><a href="index.html#contacto">Contacto</a></li>
      </ul>
    </div>
  </nav>

  <main class="contenedor">
    <a class="volver" href="index.html#proyectos">← Todos los proyectos</a>

    <header class="cabecera-galeria" id="cabecera">
      <h1>Galería</h1>
      <noscript><p>Esta galería necesita JavaScript. Puedes ver los proyectos en la <a href="index.html#proyectos">página principal</a>.</p></noscript>
    </header>

    <section class="galeria" aria-label="Capturas del proyecto">
      <div class="rejilla" id="rejilla"></div>
    </section>

    <nav class="entre-proyectos" id="entre-proyectos" aria-label="Otros proyectos"></nav>
  </main>

  <dialog class="visor" id="visor" aria-label="Captura ampliada">
    <div class="visor-barra">
      <span id="visor-contador"></span>
      <button type="button" class="visor-cerrar" id="visor-cerrar" aria-label="Cerrar">✕</button>
    </div>
    <figure class="visor-figura">
      <img id="visor-img" alt="">
      <figcaption id="visor-pie"></figcaption>
    </figure>
    <button type="button" class="visor-flecha anterior" id="visor-anterior" aria-label="Foto anterior">‹</button>
    <button type="button" class="visor-flecha siguiente" id="visor-siguiente" aria-label="Foto siguiente">›</button>
  </dialog>

  <footer>
    <div class="contenedor">Luis Angel Vazquez Estrada</div>
  </footer>

  <script src="js/proyectos.js"></script>
  <script>
    (function () {
      const proyectos = window.PROYECTOS || [];
      const slug = new URLSearchParams(location.search).get('p');
      const indice = proyectos.findIndex((p) => p.slug === slug);
      const proyecto = proyectos[indice];
      const cabecera = document.getElementById('cabecera');
      const rejilla = document.getElementById('rejilla');

      // Crea un elemento con atributos y texto sin usar innerHTML.
      function el(etiqueta, atributos, ...hijos) {
        const nodo = document.createElement(etiqueta);
        for (const [k, v] of Object.entries(atributos || {})) {
          if (v !== undefined && v !== null) nodo.setAttribute(k, v);
        }
        for (const h of hijos) nodo.append(h);
        return nodo;
      }

      if (!proyecto) {
        cabecera.replaceChildren(
          el('h1', {}, 'Proyecto no encontrado'),
          el('p', { class: 'que-es' }, 'Ese enlace no corresponde a ningún proyecto.'),
          el('p', {}, el('a', { href: 'index.html#proyectos' }, 'Ver todos los proyectos'))
        );
        return;
      }

      document.title = `${proyecto.titulo} · Galería | Luis Angel Vazquez Estrada`;

      // Cabecera del proyecto
      const partes = [];
      if (proyecto.etiqueta) partes.push(el('span', { class: 'etiqueta-equipo' }, proyecto.etiqueta));
      partes.push(el('h1', {}, proyecto.titulo));
      partes.push(el('p', { class: 'que-es' }, proyecto.queEs));
      const texto = el('div', { class: 'texto-proyecto' });
      for (const parrafo of proyecto.descripcion) texto.append(el('p', {}, parrafo));
      partes.push(texto);
      if (proyecto.aportes) {
        const lista = el('ul', { class: 'aportes' });
        for (const a of proyecto.aportes) {
          const m = a.match(/^([^:]{3,45}):\s(.+)$/);
          lista.append(m ? el('li', {}, el('strong', {}, m[1] + ':'), ' ' + m[2]) : el('li', {}, a));
        }
        partes.push(el('h2', { class: 'subtitulo-aportes' }, 'Qué hice'), lista);
      }
      const tecnologias = el('ul', { class: 'tecnologias' });
      for (const t of proyecto.tecnologias) tecnologias.append(el('li', {}, t));
      partes.push(tecnologias);
      const n = proyecto.fotos.length;
      partes.push(el('div', { class: 'enlaces' },
        proyecto.demo ? el('a', { class: 'ver-vivo', href: proyecto.demo, target: '_blank', rel: 'noopener' }, 'Ver en vivo →') : '',
        el('span', { class: 'privado' }, `${n} ${n === 1 ? 'captura' : 'capturas'}`),
        proyecto.repo
          ? el('a', { href: proyecto.repo, target: '_blank', rel: 'noopener' }, 'Ver código en GitHub →')
          : el('span', { class: 'privado' }, proyecto.repoTexto)
      ));
      cabecera.replaceChildren(...partes);

      // Rejilla de fotos. Las capturas de celular van en su propia rejilla más angosta.
      const esMovil = (f) => f.h > f.w * 1.4;
      const todasMovil = proyecto.fotos.every(esMovil);
      rejilla.classList.toggle('rejilla-movil', todasMovil);
      proyecto.fotos.forEach((foto, i) => {
        const boton = el('button', { type: 'button', class: 'miniatura' + (esMovil(foto) ? ' movil' : ''), 'aria-label': `Ampliar foto ${i + 1}: ${foto.pie}` },
          el('img', { src: foto.src, alt: foto.pie, width: foto.w, height: foto.h, loading: i < 6 ? 'eager' : 'lazy' }));
        boton.addEventListener('click', () => abrir(i));
        const pie = el('figcaption', {},
          el('span', { class: 'titulo-foto' }, el('span', { class: 'numero' }, String(i + 1).padStart(2, '0')), ' ', foto.pie));
        if (foto.explicacion) pie.append(el('span', { class: 'explicacion' }, foto.explicacion));
        rejilla.append(el('figure', { class: 'foto-galeria', id: `foto-${i + 1}` }, boton, pie));
      });

      // Enlaces al proyecto anterior y siguiente
      const entre = document.getElementById('entre-proyectos');
      const anterior = proyectos[(indice - 1 + proyectos.length) % proyectos.length];
      const siguiente = proyectos[(indice + 1) % proyectos.length];
      entre.append(
        el('a', { href: `galeria.html?p=${anterior.slug}`, class: 'anterior' }, el('span', {}, '← Proyecto anterior'), el('strong', {}, anterior.titulo)),
        el('a', { href: `galeria.html?p=${siguiente.slug}`, class: 'siguiente' }, el('span', {}, 'Proyecto siguiente →'), el('strong', {}, siguiente.titulo))
      );

      // Visor
      const visor = document.getElementById('visor');
      const visorImg = document.getElementById('visor-img');
      const visorPie = document.getElementById('visor-pie');
      const contador = document.getElementById('visor-contador');
      let actual = 0;
      let origen = null;

      function mostrar(i) {
        actual = (i + n) % n;
        const foto = proyecto.fotos[actual];
        visorImg.src = foto.src;
        visorImg.alt = foto.pie;
        visorImg.width = foto.w;
        visorImg.height = foto.h;
        visorImg.classList.toggle('movil', esMovil(foto));
        visorPie.replaceChildren(el('strong', {}, foto.pie));
        if (foto.explicacion) visorPie.append(el('span', {}, foto.explicacion));
        contador.textContent = `${actual + 1} / ${n}`;
        history.replaceState(null, '', `#foto-${actual + 1}`);
        // Precarga la siguiente
        new Image().src = proyecto.fotos[(actual + 1) % n].src;
      }
      function abrir(i) {
        origen = document.activeElement;
        mostrar(i);
        visor.showModal();
      }
      function cerrar() {
        visor.close();
      }
      visor.addEventListener('close', () => {
        history.replaceState(null, '', location.pathname + location.search);
        if (origen) origen.focus();
      });
      document.getElementById('visor-cerrar').addEventListener('click', cerrar);
      document.getElementById('visor-anterior').addEventListener('click', () => mostrar(actual - 1));
      document.getElementById('visor-siguiente').addEventListener('click', () => mostrar(actual + 1));
      visor.addEventListener('click', (e) => { if (e.target === visor) cerrar(); });
      visor.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') mostrar(actual - 1);
        if (e.key === 'ArrowRight') mostrar(actual + 1);
      });
      if (n < 2) visor.classList.add('una-foto');

      // Deslizar en el celular
      let x0 = null;
      visor.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
      visor.addEventListener('pointerup', (e) => {
        if (x0 === null) return;
        const dx = e.clientX - x0;
        x0 = null;
        if (Math.abs(dx) > 50) mostrar(actual + (dx < 0 ? 1 : -1));
      });

      // Abrir directo una foto si el enlace trae #foto-N
      const m = location.hash.match(/^#foto-(\d+)$/);
      if (m && +m[1] >= 1 && +m[1] <= n) abrir(+m[1] - 1);
    })();
  </script>
</body>
</html>
